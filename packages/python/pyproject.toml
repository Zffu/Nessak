[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nessak"
version = "0.0.1"
description = "Nessak is an experimental hash function powered by the experimental Tundra hash structure."
readme = "./README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zffu", email = "zffu@zffu.dev" }]
classifiers = ["Topic :: Security :: Cryptography", "Typing :: Typed", "Programming Language :: Python :: 3"]
dependencies = ["numpy>=1.21"]

[project.urls]
Source = "https://github.com/Zffu/Nessak"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=7.4.4"]
