[package]
name = "nessak"
version = "1.0.0"
authors = ["Zffu <zffu@zffu.dev>"]
description = "Nessak is an experimental hash function powered by the experimental Tundra hash structure."
repository = "https://github.com/Zffu/Nessak"
readme = "./README.md"
license = "MIT"
categories = ["algorithms", "cryptography"]
