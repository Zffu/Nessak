[package]
name = "nessak"
version = "1.0.0"
authors = ["Zffu <zffu@zffu.dev>"]
description = "Nessak is an experimental hash function powered by the experimental Tundra hash structure."
repository = "https://github.com/Zffu/Nessak"
readme = "./README.md"
license = "MIT"
categories = ["algorithms", "cryptography"]
edition = "2024"

[[test]]
name = "tundra_rt"
required-features = ["tundra-nessak", "safety-checks"]

[[test]]
name = "tundra_const"
required-features = ["tundra-nessak", "const"]

[features]
tundra = []
tundra-nessak = ["tundra"]
standalone = []
safety-checks = []
const = []

default = ["safety-checks", "tundra-nessak", "standalone"]
